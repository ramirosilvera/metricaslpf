name: Deploy Worker (asistente IA)

# Este workflow publica el proxy serverless (Cloudflare Worker) que sostiene
# la clave de Gemini del lado del servidor. No corre a menos que existan los
# secrets de Cloudflare/Gemini -- ver worker/README.md para el setup manual.
on:
  push:
    branches: [main, claude/metricas-mundial-architecture-gqk5x6]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Fijadas a SHA (no a la tag @v4) -- ver el comentario en deploy.yml,
      # mismo motivo: la resolución de tag a commit de GitHub puede fallar
      # con "Service Unavailable" en "Set up job".
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: worker/package.json

      - name: Instalar dependencias
        working-directory: worker
        run: npm install

      - name: Verificar secrets de Cloudflare
        id: check
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Faltan los secrets CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID -- se salta el deploy del Worker. Ver worker/README.md."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy a Cloudflare Workers
        if: steps.check.outputs.skip == 'false'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Configurar GEMINI_API_KEY como secreto del Worker
        if: steps.check.outputs.skip == 'false'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::warning::Falta el secret GEMINI_API_KEY -- el Worker quedo deployado pero el asistente respondera 'not_configured' hasta que se cargue. Ver worker/README.md."
          else
            printf '%s' "$GEMINI_API_KEY" | npx wrangler secret put GEMINI_API_KEY
          fi
