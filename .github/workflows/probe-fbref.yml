name: Probe FotMob topstats.json (categorias de estadistica individual LPF)

# Sonda final: FotMob expone stats.seasonStatLinks con una ruta directa a
# stats/112/season/28207/topstats.json -- se investiga que tan profundo es
# (cuantas categorias: goles, asistencias, remates, tarjetas, rating, etc.)
# para decidir si alcanza para construir un ranking real de jugadores de la
# temporada actual de LPF. Se borra tras decidir.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar requests
        run: pip install requests
      - name: Explorar topstats.json
        run: |
          python3 - <<'PY'
          import json, requests

          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36")
          H = {"User-Agent": UA, "Accept": "application/json", "Accept-Language": "es-AR,es;q=0.9"}

          def get(url, label=""):
              try:
                  r = requests.get(url, headers=H, timeout=25)
                  print(f"  [{label}] {url} -> {r.status_code} len={len(r.content)}")
                  return r
              except Exception as e:
                  print(f"  [{label}] {url} -> ERROR {type(e).__name__}: {e}")
                  return None

          # RelativePath de la temporada actual (2026), tomado de la sonda anterior
          r = get("https://www.fotmob.com/api/stats/112/season/28207/topstats.json", label="topstats-v1")
          if r is None or not r.ok:
              r = get("https://www.fotmob.com/api/data/stats/season/topstats?id=112&season=28207", label="topstats-v2")
          if r is None or not r.ok:
              r = get("https://www.fotmob.com/api/leagues?id=112&season=28207&type=topstats", label="topstats-v3")
          if r is not None and r.ok:
              d = r.json()
              print("  top keys:", list(d.keys()) if isinstance(d, dict) else type(d))
              if isinstance(d, dict):
                  for key in ("statTypes", "playerStats", "topLists", "data"):
                      if key in d:
                          v = d[key]
                          print(f"  [{key}]:", type(v), len(v) if isinstance(v, (list, dict)) else v)
              # buscar de forma generica cualquier lista de categorias/stats
              def walk(obj, path="", depth=0):
                  if depth > 3:
                      return
                  if isinstance(obj, dict):
                      for k, v in obj.items():
                          if isinstance(v, list) and v and isinstance(v[0], dict) and depth <= 2:
                              print(f"    lista en {path}.{k}: len={len(v)} keys_ej={list(v[0].keys())[:8]}")
                          walk(v, f"{path}.{k}", depth + 1)
                  elif isinstance(obj, list):
                      for item in obj[:3]:
                          walk(item, path + "[]", depth + 1)
              walk(d)
              print("  RAW (primeros 2000 chars):", json.dumps(d, ensure_ascii=False)[:2000])
          PY
