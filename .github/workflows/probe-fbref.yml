name: Probe FotMob topstats.json (categorias de estadistica individual LPF)

# Sonda final: FotMob expone stats.seasonStatLinks con una ruta directa a
# stats/112/season/28207/topstats.json -- se investiga que tan profundo es
# (cuantas categorias: goles, asistencias, remates, tarjetas, rating, etc.)
# para decidir si alcanza para construir un ranking real de jugadores de la
# temporada actual de LPF. Se borra tras decidir.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar requests
        run: pip install requests
      - name: Explorar topstats.json
        run: |
          python3 - <<'PY'
          import json, requests

          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36")
          H = {"User-Agent": UA, "Accept": "application/json", "Accept-Language": "es-AR,es;q=0.9"}

          def get(url, label=""):
              try:
                  r = requests.get(url, headers=H, timeout=25)
                  print(f"  [{label}] {url} -> {r.status_code} len={len(r.content)}")
                  return r
              except Exception as e:
                  print(f"  [{label}] {url} -> ERROR {type(e).__name__}: {e}")
                  return None

          r = get("https://www.fotmob.com/api/data/leagues?id=112", label="fotmob-leagues")
          if r is not None and r.ok:
              d0 = r.json()
              players_leaders = ((d0.get("stats") or {}).get("players")) or []
              print(f"  categorias de lideres (jugadores): {len(players_leaders)}")
              for entry in players_leaders:
                  header = entry.get("header")
                  stat_name = ((entry.get("participant") or {}).get("stat") or {}).get("name")
                  print(f"    - {header}  (stat={stat_name})")
              print("  entry[0] completo:", json.dumps(players_leaders[0], ensure_ascii=False)[:800] if players_leaders else None)

              print("=== fetchAllUrl (lista completa, no solo top 3) ===")
              if players_leaders:
                  url = players_leaders[0].get("fetchAllUrl")
                  r2 = get(url, label="fetchall-goals")
                  if r2 is not None and r2.ok:
                      d2 = r2.json()
                      print("  top keys:", list(d2.keys()) if isinstance(d2, dict) else type(d2))
                      rows = d2.get("TopLists") or d2.get("statList") or d2
                      print("  shape:", type(rows), len(rows) if isinstance(rows, (list, dict)) else rows)
                      print("  RAW (primeros 1500 chars):", json.dumps(d2, ensure_ascii=False)[:1500])

                  # tambien probamos una categoria defensiva (tackles) para
                  # confirmar que no es solo delanteros
                  tackles_entry = next((e for e in players_leaders if (e.get("participant") or {}).get("stat", {}).get("name") == "total_tackle"), None)
                  if tackles_entry:
                      r3 = get(tackles_entry.get("fetchAllUrl"), label="fetchall-tackles")
                      if r3 is not None and r3.ok:
                          d3 = r3.json()
                          sl3 = d3["TopLists"][0]["StatList"]
                          print(f"  tackles: {len(sl3)} jugadores en la lista")

                  sl2 = d2["TopLists"][0]["StatList"]
                  print(f"  goals: {len(sl2)} jugadores en la lista")
                  teams_in_goals = {row["TeamName"] for row in sl2}
                  print(f"  goals: {len(teams_in_goals)} equipos distintos representados")
                  # ultimo (rank mas bajo) para ver si llega a jugadores con StatValue 0/1
                  print("  goals ultimos 3:", json.dumps(sl2[-3:], ensure_ascii=False))

                  saves_entry = next((e for e in players_leaders if (e.get("participant") or {}).get("stat", {}).get("name") == "saves"), None)
                  if saves_entry:
                      r4 = get(saves_entry.get("fetchAllUrl"), label="fetchall-saves")
                      if r4 is not None and r4.ok:
                          d4 = r4.json()
                          sl4 = d4["TopLists"][0]["StatList"]
                          print(f"  saves (arqueros): {len(sl4)} jugadores en la lista")
                          print("  saves top 3:", json.dumps(sl4[:3], ensure_ascii=False))
          PY
