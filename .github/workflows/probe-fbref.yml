name: Probe esfuerzo fisico LPF (WhoScored / AFA / Liga Profesional oficial)

# Sonda final de fisico: busca si existe, en alguna fuente gratuita, un dato
# de esfuerzo fisico REAL (distancia recorrida, sprints, intensidad) para la
# Liga Profesional Argentina -- ni ESPN ni FotMob ni API-Football lo traen.
# Se prueba WhoScored (deriva de Opta, algunas ligas exponen "distance") y el
# sitio oficial de la Liga Profesional / AFA. Se borra tras decidir.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar requests
        run: pip install requests
      - name: Probar WhoScored y sitios oficiales AFA/LPF
        run: |
          python3 - <<'PY'
          import requests

          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36")

          def get(url, label=""):
              h = {"User-Agent": UA, "Accept": "text/html,application/json", "Accept-Language": "es-AR,es;q=0.9"}
              try:
                  r = requests.get(url, headers=h, timeout=20)
                  body = r.text[:300].replace("\n", " ")
                  print(f"  [{label}] {url} -> {r.status_code} len={len(r.content)}")
                  low = r.text.lower()
                  for token in ["distance covered", "distancia recorrida", "sprint", "physical", "km/h", "gps"]:
                      if token in low:
                          print(f"      contiene '{token}'")
                  if r.status_code >= 400:
                      print("      body:", body)
                  return r
              except Exception as e:
                  print(f"  [{label}] {url} -> ERROR {type(e).__name__}: {e}")
                  return None

          print("=== WhoScored ===")
          get("https://www.whoscored.com/Regions/44/Tournaments/95/Argentina-Liga-Profesional", label="whoscored-comp")
          get("https://www.whoscored.com/StatisticsFeed/1/GetPlayerStatistics", label="whoscored-api-guess")

          print("=== AFA oficial ===")
          get("https://www.afa.com.ar/es/liga-profesional", label="afa-lp")
          get("https://www.afa.com.ar", label="afa-home")

          print("=== Liga Profesional de Futbol (sitio propio) ===")
          get("https://www.ligaprofesional.ar", label="lpf-home")
          get("https://www.ligaprofesional.ar/estadisticas", label="lpf-stats")

          print("=== TyC Sports / TNT Sports (broadcasters, a veces exponen data-viz) ===")
          get("https://www.tycsports.com/futbol-argentino", label="tyc")
          PY
