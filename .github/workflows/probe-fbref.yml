name: Probe fbref via navegador real (Playwright/Cloudflare)

# Sonda decisiva y descartable: fbref responde 403 a `requests` (IP de
# datacenter) porque interpone un desafío JavaScript de Cloudflare
# ("Just a moment..."). Un cliente HTTP plano no lo puede resolver. Esta
# sonda usa un navegador real (Playwright + Chromium) DENTRO de GitHub
# Actions para ver si, ejecutando ese JS, se pasa el desafío y se llega a la
# tabla de la Liga Profesional. Es la prueba definitiva de si "directo a
# fbref" es viable desde la infraestructura. Se borra tras decidir.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar Playwright + Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Intentar pasar Cloudflare y leer la tabla LPF
        run: |
          python3 - <<'PY'
          from playwright.sync_api import sync_playwright
          import time

          URL = "https://fbref.com/en/comps/21/Liga-Profesional-Argentina-Stats"
          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36")

          with sync_playwright() as p:
              browser = p.chromium.launch(args=[
                  "--disable-blink-features=AutomationControlled",
                  "--no-sandbox",
              ])
              ctx = browser.new_context(
                  user_agent=UA,
                  locale="es-AR",
                  viewport={"width": 1366, "height": 900},
              )
              # oculta webdriver flag (anti-bot básico)
              ctx.add_init_script("Object.defineProperty(navigator,'webdriver',{get:()=>undefined})")
              page = ctx.new_page()
              try:
                  page.goto(URL, wait_until="domcontentloaded", timeout=45000)
              except Exception as e:
                  print("goto err:", type(e).__name__, e)

              # espera a que Cloudflare (si aparece) resuelva y redirija
              for i in range(6):
                  title = page.title()
                  print(f"  intento {i}: title={title!r}")
                  if "just a moment" not in title.lower() and "attention" not in title.lower():
                      break
                  time.sleep(5)

              html = page.content()
              title = page.title()
              print("=== RESULTADO ===")
              print("title final:", repr(title))
              print("len(html):", len(html))
              # señales de éxito: tabla de stats de la liga
              signals = {
                  "just a moment (cloudflare)": "just a moment" in html.lower(),
                  "cf-challenge": "challenge-platform" in html.lower() or "cf-chl" in html.lower(),
                  "tabla stats_squads": "stats_squads" in html or "overall" in html.lower(),
                  "menciona 'Liga Profesional'": "Liga Profesional" in html,
                  "nombres de clubes (Boca/River)": ("Boca" in html or "River" in html),
                  "xG presente": ">xG<" in html or "xg" in html.lower(),
              }
              for k, v in signals.items():
                  print(f"  [{'OK' if v else '--'}] {k}: {v}")

              # intenta encontrar una tabla concreta de la liga
              tables = page.query_selector_all("table")
              print(f"  #tablas en la página: {len(tables)}")
              browser.close()
          PY
