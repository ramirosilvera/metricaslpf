name: Probe fuentes LPF -- riqueza de stats en partido ya jugado (ESPN/FotMob)

# Sonda decisiva final: ESPN (site.api.espn.com) y FotMob (/api/data/leagues)
# respondieron 200 con fixtures REALES de la temporada actual de la LPF. Esta
# sonda confirma si, para un partido YA JUGADO (no "Scheduled"), traen
# estadisticas de partido (remates/posesion/pases) o solo resultado. Decide
# la arquitectura de datos final para Metricas LPF. Se borra tras decidir.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar requests
        run: pip install requests
      - name: Inspeccionar stats de partido jugado
        run: |
          python3 - <<'PY'
          import json, requests

          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36")

          def get(url, label=""):
              h = {"User-Agent": UA, "Accept": "application/json", "Accept-Language": "es-AR,es;q=0.9"}
              try:
                  r = requests.get(url, headers=h, timeout=25)
                  print(f"  [{label}] {url} -> {r.status_code} len={len(r.content)}")
                  return r
              except Exception as e:
                  print(f"  [{label}] {url} -> ERROR {type(e).__name__}: {e}")
                  return None

          print("=== ESPN: buscar un partido FINALIZADO reciente ===")
          # scoreboard con rango de fechas hacia atras (ultimos 10 dias) para
          # encontrar partidos con status "Final".
          r = get("https://site.api.espn.com/apis/site/v2/sports/soccer/arg.1/scoreboard?dates=20260715-20260731", label="espn-scoreboard-range")
          finished_id = None
          if r is not None and r.ok:
              d = r.json()
              events = d.get("events") or []
              print(f"    eventos en rango: {len(events)}")
              for ev in events:
                  status = ev.get("status", {}).get("type", {}).get("state")
                  if status == "post":
                      finished_id = ev.get("id")
                      print("    partido finalizado encontrado:", ev.get("name"), ev.get("date"), "id=", finished_id)
                      break
          if finished_id:
              r2 = get(f"https://site.api.espn.com/apis/site/v2/sports/soccer/arg.1/summary?event={finished_id}", label="espn-summary-final")
              if r2 is not None and r2.ok:
                  d2 = r2.json()
                  box = d2.get("boxscore") or {}
                  teams = box.get("teams") or []
                  for t in teams:
                      name = (t.get("team") or {}).get("displayName")
                      stats = {s.get("name"): s.get("displayValue") for s in (t.get("statistics") or [])}
                      print(f"    {name}: {stats}")
                  players = box.get("players") or []
                  print(f"    bloques de jugadores (por equipo): {len(players)}")
                  if players:
                      stats_defs = players[0].get("statistics") or []
                      for sd in stats_defs:
                          print("    categoria jugador:", sd.get("name"), "labels:", sd.get("labels"))
          else:
              print("    no se encontro partido finalizado en el rango probado")

          print("=== FotMob: estructura de /api/data/leagues?id=112 ===")
          r3 = get("https://www.fotmob.com/api/data/leagues?id=112", label="fotmob-data-leagues")
          if r3 is not None and r3.ok:
              d3 = r3.json()
              print("    top keys:", list(d3.keys()))
              matches = d3.get("matches") or {}
              if isinstance(matches, dict):
                  print("    matches keys:", list(matches.keys()))
                  allm = matches.get("allMatches") or []
                  print("    allMatches count:", len(allm))
                  finished_fm = [m for m in allm if (m.get("status") or {}).get("finished")]
                  print("    finished count:", len(finished_fm))
                  if finished_fm:
                      mid = finished_fm[-1].get("id")
                      print("    probando matchDetails con id=", mid)
                      r4 = get(f"https://www.fotmob.com/api/data/matchDetails?matchId={mid}", label="fotmob-data-matchdetails")
                      if r4 is not None and r4.ok:
                          d4 = r4.json()
                          print("    matchDetails top keys:", list(d4.keys()))
                          content = d4.get("content") or {}
                          print("    content keys:", list(content.keys()))
                          stats = content.get("stats")
                          if stats:
                              print("    TIENE stats:", json.dumps(stats)[:500])
                          shotmap = content.get("shotmap")
                          if shotmap:
                              print("    TIENE shotmap (posible xG por remate):", list(shotmap.keys()) if isinstance(shotmap, dict) else len(shotmap))
              table = d3.get("table")
              print("    tiene 'table':", bool(table))
          PY
