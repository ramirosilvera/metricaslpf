name: Actualizar datos

on:
  schedule:
    # cada 6 horas -- ajustar la frecuencia durante el Mundial si hace falta
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      pmsr_limit:
        description: "Maximo de PDFs PMSR a descargar/parsear en esta corrida (vacio = sin limite)"
        required: false
        default: ""
      pmsr_max_seconds:
        description: "Corte por tiempo total de descarga de PDFs en segundos (vacio = sin limite)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias del pipeline
        run: pip install -r etl/requirements.txt

      - name: Correr pipeline completo (scraping + warehouse + validacion + agregados)
        run: python etl/pipeline.py --allow-scrape-failures
        working-directory: .
        env:
          PYTHONUNBUFFERED: "1"
          PMSR_LIMIT: ${{ github.event.inputs.pmsr_limit }}
          PMSR_MAX_SECONDS: ${{ github.event.inputs.pmsr_max_seconds }}
          # Sincroniza el warehouse a Supabase (schema metricas_mundial).
          # Si estos secrets no están cargados, sync_supabase.py se
          # saltea solo -- no rompe el resto del pipeline.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Commitear datos actualizados
        run: |
          git config user.name "metricasmundial2026-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ site/public/data/ site/public/data-parquet/
          if git diff --cached --quiet; then
            echo "sin cambios en los datos"
          else
            git commit -m "chore(data): actualizacion automatica $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: Subir reportes de scraping fallidos (si los hay)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-failures
          path: |
            data/raw/*/_failed.*
            data/raw/*/_discovery_status.json
          if-no-files-found: ignore

