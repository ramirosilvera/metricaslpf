name: Actualizar datos

on:
  schedule:
    # cada 6 horas
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    # Margen para el scraping de ESPN (~300 partidos) + FotMob (37 categorías) --
    # ninguno de los dos tiene corte propio por tiempo, así que el límite real
    # es este timeout del job.
    timeout-minutes: 30
    steps:
      # Fijadas a SHA (no a la tag @v4/@v5) -- ver el comentario en
      # deploy.yml, mismo motivo: la resolución de tag a commit de GitHub
      # puede fallar con "Service Unavailable" en "Set up job".
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      # ESPN empezó a devolver 403 "Access Denied" al scraper el 2026-08-04
      # (ver el manejo de esto en etl/fetch_espn_lpf.py, _FETCH_ERRORS/
      # _failed.json). Hipótesis con más sustento: sin caché entre corridas
      # (data/raw/espn/cache/ está en .gitignore -- cada corrida de CI
      # arranca de un checkout limpio), cada corrida repetía ~300 requests
      # de resumen de partido YA conocidos (son inmutables una vez jugado el
      # partido) además de los nuevos, 4 veces por día -- un patrón de
      # volumen típico de lo que un WAF marca como abuso. Este cache
      # persiste esos resúmenes entre corridas vía GitHub Actions (no se
      # commitea al repo, sería mucho peso e irrelevante para el sitio) --
      # de acá en más cada corrida solo pide lo que todavía no tiene.
      # key único por run + restore-keys por prefijo: el patrón estándar
      # para que el cache ACUMULE entre corridas (una key ya guardada es
      # inmutable, no se puede pisar).
      - name: Cache de resúmenes de partido ESPN (entre corridas)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          # Solo *_summary.json (un partido YA JUGADO no cambia -- cachear
          # para siempre es correcto). Los rosters (team_*_roster.json) se
          # excluyen a propósito: un plantel SÍ cambia (altas/bajas), así
          # que cachearlos para siempre los dejaría viejos en silencio --
          # se siguen pidiendo frescos en cada corrida, igual que antes.
          path: data/raw/espn/cache/*_summary.json
          key: espn-summary-cache-${{ github.run_id }}
          restore-keys: |
            espn-summary-cache-

      - name: Instalar dependencias del pipeline
        run: pip install -r etl/requirements.txt

      - name: Correr pipeline completo (scraping + warehouse + validacion + agregados)
        run: python etl/pipeline.py --allow-scrape-failures
        working-directory: .
        env:
          PYTHONUNBUFFERED: "1"
          # API-Football: fallback histórico opcional, no lo corre el pipeline
          # hoy (ver etl/pipeline.py) -- el secret queda cargado por si se
          # reactiva. Sin él, fetch_api_football_lpf.py (si se corre a mano)
          # escribe CSV vacíos-válidos y no rompe nada.
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          # Sincroniza el warehouse a Supabase (schema metricas_mundial).
          # Si estos secrets no están cargados, sync_supabase.py se
          # saltea solo -- no rompe el resto del pipeline.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Commitear datos actualizados
        run: |
          git config user.name "metricaslpf-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ site/public/data/ site/public/data-parquet/
          if git diff --cached --quiet; then
            echo "sin cambios en los datos"
          else
            git commit -m "chore(data): actualizacion automatica $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: Subir reportes de scraping fallidos (si los hay)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scrape-failures
          path: |
            data/raw/*/_failed.*
            data/raw/*/_discovery_status.json
          if-no-files-found: ignore

# trigger workflow indexing
