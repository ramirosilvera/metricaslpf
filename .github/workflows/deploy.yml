name: Deploy a GitHub Pages

on:
  push:
    # el repo no tiene "main" todavia -- deployar desde la rama que hoy es
    # default branch, y desde main tambien por si se crea/renombra despues
    branches: [main, claude/metricas-mundial-architecture-gqk5x6]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: site/package-lock.json

      - name: Instalar dependencias
        working-directory: site
        run: npm ci

      - name: Build
        working-directory: site
        env:
          # URL del Worker del asistente de IA. Es una variable de repo (no un
          # secret): es pública igual, porque termina en el JS que se sirve al
          # navegador. Se setea en Settings -> Secrets and variables -> Actions
          # -> Variables, una vez que el Worker esté deployado (ver worker/README.md).
          # Si no está seteada, el sitio compila igual y el chat simplemente no aparece.
          PUBLIC_CHAT_API_URL: ${{ vars.PUBLIC_CHAT_API_URL }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

# trigger workflow indexing
