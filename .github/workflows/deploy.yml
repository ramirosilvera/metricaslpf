name: Deploy a GitHub Pages

# Las Actions de abajo van fijadas a un SHA de commit (no a la tag flotante
# @v4/@v5) -- varias corridas seguidas fallaron en "Set up job" con "Service
# Unavailable" resolviendo la Action, un error de la infraestructura de
# GitHub al traducir la tag a un commit (una llamada extra a su API que en
# ese momento no respondía). Fijar el SHA se salta esa resolución. El
# comentario al final de cada línea documenta a qué versión corresponde el
# SHA -- actualizarlo a mano cuando se quiera subir de versión.
on:
  push:
    # el repo no tiene "main" todavia -- deployar desde la rama que hoy es
    # default branch, y desde main tambien por si se crea/renombra despues
    branches: [main, claude/metricas-mundial-architecture-gqk5x6]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: site/package-lock.json

      - name: Instalar dependencias
        working-directory: site
        run: npm ci

      # Chequeo explícito ANTES del build: si PUBLIC_SUPABASE_URL/ANON_KEY no
      # resolvieron (typo en el nombre, cargadas como Secret en vez de
      # Variable -- son dos pestañas distintas en Settings -> Secrets and
      # variables -> Actions, y `${{ vars.X }}` SOLO lee la pestaña
      # Variables --, o el nombre del repo no es el que tiene los secrets
      # cargados), esto corta acá con un error explícito en vez de dejar
      # que el sitio compile "bien" y falle en silencio recién en el
      # navegador del usuario (exactamente lo que pasó: build en verde,
      # deploy en verde, sitio mostrando "no configurado").
      - name: Verificar variables de Supabase
        run: |
          faltan=""
          [ -z "${{ vars.PUBLIC_SUPABASE_URL }}" ] && faltan="$faltan PUBLIC_SUPABASE_URL"
          [ -z "${{ vars.PUBLIC_SUPABASE_ANON_KEY }}" ] && faltan="$faltan PUBLIC_SUPABASE_ANON_KEY"
          if [ -n "$faltan" ]; then
            echo "::error title=Faltan variables de Supabase::No resolvieron:$faltan -- Settings > Secrets and variables > Actions > pestaña VARIABLES (no Secrets) > New repository variable. Ver README.md."
            exit 1
          fi
          echo "OK: ambas variables de Supabase resolvieron a un valor no vacío."

      - name: Build
        working-directory: site
        env:
          # URL y anon key del proyecto de Supabase. Son variables de repo (no
          # secrets): el anon key está diseñado para exponerse en el cliente
          # (la seguridad real la da RLS, no ocultar esta clave) y ambas
          # terminan igual en el JS que se sirve al navegador. Se setean en
          # Settings -> Secrets and variables -> Actions -> pestaña
          # VARIABLES (no Secrets). Ver README.md / supabase/README.md.
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

# trigger workflow indexing
