name = "metricasmundial2026-chat"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Origen permitido por CORS -- debe ser exactamente el origen (protocolo+host)
# donde se sirve el sitio de GitHub Pages, SIN el path del repo.
[vars]
ALLOWED_ORIGIN = "https://ramirosilvera.github.io"
# "gemini-2.0-flash" devolvía 404 NOT_FOUND en generateContent pese a
# figurar en /v1beta/models -- se usa el alias "-latest" que Google
# mantiene apuntando al modelo flash vigente, para no repetir este
# problema cada vez que rotan los modelos disponibles.
GEMINI_MODEL = "gemini-flash-latest"
RATE_LIMIT_PER_HOUR = "15"

# Supabase: para que el asistente pueda hacer function-calling (consultar
# datos reales en vez de solo texto grounded). SUPABASE_ANON_KEY es segura
# para estar acá en texto plano -- está diseñada por Supabase para uso
# público del lado del cliente, protegida por las políticas RLS de solo
# lectura del schema metricas_mundial (nunca la service_role key, esa solo
# la usa el pipeline de ETL para escribir datos, ver etl/sync_supabase.py).
SUPABASE_URL = "https://arzzwzuuoysqhgnaprha.supabase.co"
SUPABASE_ANON_KEY = "sb_publishable_GqaTEmCMmWWkd970obRKBg_mSAH3wJX"

# Rate limiting por IP es opcional: si no se crea/bindea este namespace KV,
# el Worker sigue funcionando (ver checkRateLimit en src/index.js), solo
# que sin el límite adicional por hora -- y con un warning en los logs,
# porque en un repo PÚBLICO la URL del Worker no es secreta (va en el
# bundle del sitio) y sin esta capa cualquiera que la encuentre puede
# agotar la clave prepaga de Gemini pegándole directo, sin pasar por CORS.
#
# Para activarlo:
#   npx wrangler kv namespace create RATE_LIMIT
# y descomentar las siguientes 3 líneas con el id que devuelva ese comando:
#
# [[kv_namespaces]]
# binding = "RATE_LIMIT"
# id = "REEMPLAZAR_CON_EL_ID_REAL"

# GEMINI_API_KEY NO va acá -- se carga como secreto de Cloudflare
# (`wrangler secret put GEMINI_API_KEY`), nunca en texto plano en este archivo.
